name: Build irl-core for Minecraft 26.3
on:
  push:
    branches: [port/26.3]
  pull_request:
    branches: [port/26.3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build core
        run: bash ./gradlew clean build
